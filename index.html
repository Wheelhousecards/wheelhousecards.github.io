<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wheelhouse Consignment</title>
<meta name="description" content="See every card you’ve consigned with Wheelhouse, live on Fanatics Collect and PC Sportscards.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='3' width='18' height='26' rx='3' fill='%231d5a86'/%3E%3Crect x='10' y='6' width='12' height='5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<header><div class="wrap">
  <div class="brand"><b>Wheelhouse</b><span>Consignment</span></div>
  <div class="hdr-actions" id="acct" hidden><span class="who-chip" id="acct-email"></span><button class="btn ghost sm" type="button" id="logout">Sign out</button></div>
</div></header>

<main>
  <div class="wrap">
    <section class="gate" id="gate" hidden></section>
    <div class="loading" id="loading">Loading…</div>
    <section class="gate" id="none" hidden>
      <div class="box">
        <h1>No consignment account yet</h1>
        <p id="none-msg"></p>
        <p id="none-contact"></p>
        <button class="btn ghost" type="button" id="none-out">Use a different email</button>
      </div>
    </section>
    <section id="dash" hidden style="display:grid;gap:18px;padding-block:20px 8px"></section>
  </div>
</main>
<footer><div class="wrap">Wheelhouse Associates LLC · Consigned cards sell through Fanatics Collect and PC Sportscards</div></footer>

<script type="module" src="assets/portal.js"></script>
</body>
</html>
